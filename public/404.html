<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Belt and braces: this file is served with a real HTTP 404 status, and
         noindex makes sure it never creps into the index either. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found | Veritas</title>
    <meta name="description" content="That page doesn't exist. Head back to Veritas and ask five AI agents instead." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --card: #f3f4f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --border: #374151;
          --card: #1f2937;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem 1rem;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      .code {
        font-size: clamp(4rem, 18vw, 9rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        margin: 0;
      }
      h1 { font-size: clamp(1.25rem, 4vw, 1.75rem); margin: 0; }
      p { color: var(--muted); max-width: 34rem; margin: 0; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      nav a {
        display: inline-block;
        padding: 0.65rem 1.4rem;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        border: 1px solid var(--border);
        color: var(--fg);
        transition: opacity 0.15s ease;
      }
      nav a:hover { opacity: 0.75; }
      nav a.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
      .brand {
        position: fixed;
        top: 1.25rem;
        left: 1.5rem;
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: 0.14em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <span class="brand">VERITAS</span>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>
      That link points at a page that doesn't exist — it may have moved, or the
      address might have a typo. Everything worth reading is one click away.
    </p>
    <nav>
      <a class="primary" href="/">Back to home</a>
      <a href="/faq">Frequently asked questions</a>
      <a href="/privacy">Privacy policy</a>
      <a href="/signup">Create an account</a>
    </nav>
  </body>
</html>
